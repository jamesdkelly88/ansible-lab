- name: Install typing_extensions without removing Debian package
  ansible.builtin.pip:
    name: typing_extensions
    state: latest
    extra_args: --ignore-installed
    break_system_packages: true
  become: true
  when: patching == "debian"

- name: Install required pip packages
  ansible.builtin.pip:
    name: "{{ item }}"
    state: latest
    break_system_packages: true
  with_items: "{{ pips['all'] + pips[patching] }}"
  loop_control:
    loop_var: item
  become: true